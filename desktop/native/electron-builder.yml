appId: org.duckdns.darkdck.native
productName: DxD Native
electronVersion: 45.2.3
npmRebuild: false
directories:
  app: payload
  output: release
files:
  - from: .
    filter: [package.json, LICENSE, startup-update.mjs, encoder-runtime.cjs, native-encoder-main.cjs, 'dist/**', '!**/*.map']
  - from: vendor
    to: node_modules
    filter: ['**/*']
extraResources:
  - from: payload/icons
    to: icons
  - from: payload/badges
    to: badges
asarUnpack:
  - dist/renderer/**
  - '**/*.node'
  - '**/*.dll'
  - '**/*.exe'
  - '**/*.wasm'
electronFuses:
  # Fluxer probes its native modules in an isolated Electron-as-Node child.
  runAsNode: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
protocols:
  - name: DxD Native
    schemes: [dxd-native]
win:
  target: nsis
  icon: payload/icons/icon.ico
publish:
  provider: generic
  url: https://github.com/DarlingDemon/DxD/releases/latest/download/
  useMultipleRangeRequest: false
nsis:
  artifactName: DxD-Native-Setup-${version}-Windows-${arch}.exe
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  differentialPackage: false
